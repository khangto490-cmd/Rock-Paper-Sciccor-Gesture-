<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oẳn Tù Tì AI - Chơi Với AI Qua Webcam</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Container chính của toàn bộ trò chơi: Vừa đúng 1 màn hình, không cuộn -->
  <main class="app-container">

    <!-- ==================== MÀN HÌNH TRANG CHỦ ==================== -->
    <section id="screen-home" class="screen screen-home active">
      <div class="home-layout">
        
        <!-- Tiêu đề và dòng phụ -->
        <header class="home-header">
          <h1 class="home-title">OẲN TÙ TÌ AI</h1>
          <p class="home-subtitle">Chơi với AI bằng webcam</p>
        </header>

        <!-- 3 Bàn tay phẳng SVG xếp ngang: KÉO - BÚA - BAO -->
        <div class="hands-showcase">
          <!-- 1. KÉO -->
          <div class="hand-card card-scissors" title="Kéo">
            <div class="hand-svg-wrap">
              <svg viewBox="0 0 100 100" class="hand-svg" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Cổ tay -->
                <rect x="38" y="70" width="24" height="18" rx="5" fill="#334155"/>
                <!-- Lòng bàn tay & ngón gập -->
                <rect x="34" y="42" width="32" height="30" rx="8" fill="#3b82f6"/>
                <rect x="46" y="46" width="18" height="8" rx="4" fill="#1d4ed8"/>
                <rect x="46" y="55" width="18" height="8" rx="4" fill="#1e40af"/>
                <!-- Ngón cái gập ngang -->
                <path d="M30 48 C30 40, 48 42, 52 48 C52 54, 44 56, 36 56 Z" fill="#60a5fa"/>
                <!-- Hai ngón trỏ & giữa chĩa ra hình chữ V -->
                <rect x="34" y="14" width="10" height="35" rx="5" transform="rotate(-15 34 44)" fill="#93c5fd"/>
                <rect x="50" y="14" width="10" height="35" rx="5" transform="rotate(15 50 44)" fill="#93c5fd"/>
              </svg>
            </div>
            <span class="hand-name">KÉO</span>
          </div>

          <!-- 2. BÚA -->
          <div class="hand-card card-rock" title="Búa">
            <div class="hand-svg-wrap">
              <svg viewBox="0 0 100 100" class="hand-svg" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Cổ tay -->
                <rect x="38" y="70" width="24" height="18" rx="5" fill="#334155"/>
                <!-- Khối nắm đấm -->
                <rect x="28" y="34" width="44" height="38" rx="12" fill="#f59e0b"/>
                <!-- Các ngón gập lại -->
                <rect x="32" y="38" width="36" height="7" rx="3.5" fill="#d97706"/>
                <rect x="32" y="46" width="36" height="7" rx="3.5" fill="#b45309"/>
                <rect x="32" y="54" width="36" height="7" rx="3.5" fill="#92400e"/>
                <rect x="32" y="62" width="34" height="6" rx="3" fill="#78350f"/>
                <!-- Ngón cái cuộn ngoài -->
                <path d="M26 44 C24 35, 42 34, 48 37 C52 39, 52 46, 44 48 C36 50, 26 48, 26 44 Z" fill="#fbbf24"/>
              </svg>
            </div>
            <span class="hand-name">BÚA</span>
          </div>

          <!-- 3. BAO -->
          <div class="hand-card card-paper" title="Bao">
            <div class="hand-svg-wrap">
              <svg viewBox="0 0 100 100" class="hand-svg" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Cổ tay -->
                <rect x="38" y="72" width="24" height="18" rx="5" fill="#334155"/>
                <!-- Lòng bàn tay -->
                <path d="M34 46 C34 46, 30 62, 34 72 L66 72 C70 62, 66 46, 66 46 Z" fill="#22c55e"/>
                <!-- Ngón cái choãi ra -->
                <rect x="20" y="44" width="18" height="10" rx="5" transform="rotate(-30 20 44)" fill="#4ade80"/>
                <!-- 4 ngón duỗi thẳng -->
                <rect x="34" y="16" width="9" height="33" rx="4.5" fill="#86efac"/>
                <rect x="45" y="12" width="10" height="37" rx="5" fill="#86efac"/>
                <rect x="56" y="16" width="9" height="33" rx="4.5" fill="#86efac"/>
                <rect x="66" y="24" width="8" height="26" rx="4" fill="#4ade80"/>
              </svg>
            </div>
            <span class="hand-name">BAO</span>
          </div>
        </div>

        <!-- MỘT nút CHƠI duy nhất, to, phong cách game -->
        <div class="home-action">
          <button id="btn-play" class="btn-game-play-home" aria-label="Bắt đầu chơi game">
            CHƠI
          </button>
        </div>

      </div>
    </section>

    <!-- ==================== MÀN HÌNH CHƠI (GAME SCREEN) ==================== -->
    <section id="screen-game" class="screen screen-game">
      <div class="game-layout">

        <!-- 1. THANH TRÊN (TOP BAR) -->
        <header class="game-header">
          <!-- Nút Trang chủ nhỏ bên trái -->
          <button id="btn-back" class="btn-home-nav" title="Quay về trang chủ">
            ← Trang chủ
          </button>

          <!-- Bảng điểm ở giữa phía trên -->
          <div class="scoreboard">
            <div class="score-main">
              <span class="score-team team-player">BẠN</span>
              <span id="score-player" class="score-num num-player">0</span>
              <span class="score-sep">–</span>
              <span id="score-ai" class="score-num num-ai">0</span>
              <span class="score-team team-ai">AI</span>
            </div>
            <div class="score-sub">
              Hòa: <span id="score-draw">0</span> • Hủy: <span id="score-cancels">0</span>
            </div>
          </div>

          <!-- Status pill và FPS bên phải -->
          <div class="status-wrap">
            <div id="status-pill" class="status-pill">
              <span class="status-dot"></span>
              <span id="ai-status-text">Đang khởi động</span>
            </div>
            <span id="fps-counter" class="fps-badge">-- FPS</span>
          </div>
        </header>

        <!-- 2. KHU VỰC THI ĐẤU CHIA ĐÔI HAI BÊN -->
        <div class="arena-wrap">
          
          <!-- KHUNG TRÁI: BẠN (Viền xanh dương --c-player) -->
          <div class="arena-panel panel-player">
            <div class="panel-header">
              <span class="panel-tag tag-player">BẠN</span>
              <span class="panel-hint">Ô A (Búa) → Ô B</span>
            </div>

            <!-- Khung webcam giữ tỉ lệ 4:3 và to nhất có thể, img và overlay chung hộp position:relative -->
            <div class="cam-viewport-box">
              <!-- Ảnh webcam MJPEG từ server: ĐÃ lật gương, KHÔNG lật thêm bằng CSS -->
              <img id="cam-feed" alt="Webcam Feed">

              <div id="cam-placeholder" class="cam-placeholder">
                <span class="cam-icon">📹</span>
                <span>Đang chờ camera...</span>
              </div>

              <div id="cam-demo-badge" class="cam-demo-badge" style="display: none;">
                DEMO
              </div>

              <!-- Lớp SVG Overlay đè lên webcam (viewBox 640x480, đúng chuẩn tọa độ server) -->
              <svg id="overlay" viewBox="0 0 640 480" preserveAspectRatio="none">
                <defs>
                  <!-- Mũi tên hướng sang ô B -->
                  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1 L 8 5 L 0 9 z" fill="currentColor"/>
                  </marker>
                </defs>

                <!-- Dải cho phép A-B nét dày màu trắng, opacity 0.12 -->
                <line id="ov-band" x1="128" y1="240" x2="512" y2="240" stroke="#ffffff" stroke-opacity="0.12" stroke-linecap="round"/>

                <!-- Đường nối A-B nét đứt 3px, có mũi tên -->
                <line id="ov-line" x1="128" y1="240" x2="512" y2="240" stroke="#94a3b8" stroke-opacity="0.8" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>

                <!-- VẠCH vuông góc với đường A-B tại gate_f -->
                <line id="ov-gate" x1="224" y1="184" x2="224" y2="296" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>

                <!-- Ô B -->
                <g id="ov-group-b">
                  <circle id="ov-circle-b" cx="512" cy="240" r="62.4" fill="none" stroke="#94a3b8" stroke-opacity="0.8" stroke-width="4"/>
                  <text id="ov-text-b" x="512" y="249" text-anchor="middle" font-size="28" font-weight="800" fill="#94a3b8" fill-opacity="0.8">B</text>
                </g>

                <!-- Ô A -->
                <g id="ov-group-a">
                  <circle id="ov-circle-a" cx="128" cy="240" r="62.4" fill="none" stroke="#f59e0b" stroke-width="4"/>
                  <!-- Vòng tiến độ giữ búa theo a_hold từ 12 giờ -->
                  <circle id="ov-progress-a" cx="128" cy="240" r="62.4" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round" transform="rotate(-90 128 240)"/>
                  <text id="ov-text-a" x="128" y="238" text-anchor="middle" font-size="26" font-weight="800" fill="#f1f5f9">A</text>
                  <text id="ov-subtext-a" x="128" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#f59e0b">BÚA</text>
                </g>

                <!-- Chấm tròn nhỏ hiển thị điểm đại diện bàn tay người chơi -->
                <circle id="ov-hand" cx="128" cy="240" r="7" fill="#ffffff" stroke="#000000" stroke-width="1.5" style="display: none;"/>
              </svg>
            </div>

            <!-- THANH HƯỚNG DẪN NẰM NGAY DƯỚI WEBCAM (KHÔNG ĐÈ LÊN WEBCAM) -->
            <div id="hint-bar" class="hint-bar border-player">
              <div id="hint-title" class="hint-title">SẴN SÀNG</div>
              <div id="hint-detail" class="hint-detail">Nhấn SPACE để chơi</div>
            </div>
          </div>

          <!-- KHUNG PHẢI: AI (Viền cam --c-ai) -->
          <div class="arena-panel panel-ai">
            <div class="panel-header">
              <span class="panel-tag tag-ai">AI</span>
              <span class="panel-hint">ĐỐI THỦ ROBOT</span>
            </div>

            <div class="ai-viewport-box">
              <!-- Nhân vật robot phẳng SVG -->
              <div class="ai-robot-avatar">
                <svg viewBox="0 0 100 80" class="robot-svg" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <!-- Anten -->
                  <line x1="50" y1="20" x2="50" y2="8" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
                  <circle cx="50" cy="7" r="5" fill="#f97316"/>
                  <!-- Tai hai bên -->
                  <rect x="12" y="32" width="6" height="18" rx="3" fill="#f97316"/>
                  <rect x="82" y="32" width="6" height="18" rx="3" fill="#f97316"/>
                  <!-- Đầu robot phẳng -->
                  <rect x="18" y="20" width="64" height="46" rx="16" fill="#0f172a" stroke="#334155" stroke-width="3"/>
                  <!-- Màn hình mắt -->
                  <rect x="25" y="28" width="50" height="22" rx="8" fill="#1e293b"/>
                  <!-- Hai mắt tròn màu cam -->
                  <circle cx="38" cy="39" r="6" fill="#f97316"/>
                  <circle cx="62" cy="39" r="6" fill="#f97316"/>
                  <circle cx="40" cy="38" r="2" fill="#ffffff"/>
                  <circle cx="64" cy="38" r="2" fill="#ffffff"/>
                  <!-- Miệng robot -->
                  <rect x="42" y="54" width="16" height="4" rx="2" fill="#94a3b8"/>
                </svg>
              </div>

              <!-- Ô TAY AI (LỚN, BÍ ẨN TRỪ KHI RESULT) -->
              <div id="ai-hand-box" class="ai-hand-box">
                <!-- 1. Bàn tay bí ẩn (Hiện trong mọi phase trừ RESULT) -->
                <div id="ai-hand-mystery" class="ai-hand-item active">
                  <div class="mystery-graphic">
                    <svg viewBox="0 0 100 100" class="hand-svg-large" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <rect x="38" y="70" width="24" height="18" rx="5" fill="#334155"/>
                      <rect x="28" y="34" width="44" height="38" rx="12" fill="#64748b"/>
                      <rect x="32" y="38" width="36" height="7" rx="3.5" fill="#475569"/>
                      <rect x="32" y="46" width="36" height="7" rx="3.5" fill="#475569"/>
                      <rect x="32" y="54" width="36" height="7" rx="3.5" fill="#475569"/>
                      <path d="M26 44 C24 35, 42 34, 48 37 C52 39, 52 46, 44 48 C36 50, 26 48, 26 44 Z" fill="#94a3b8"/>
                    </svg>
                    <div class="mystery-q">?</div>
                  </div>
                </div>

                <!-- 2. AI ra BÚA -->
                <div id="ai-hand-rock" class="ai-hand-item">
                  <svg viewBox="0 0 100 100" class="hand-svg-large" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="38" y="70" width="24" height="18" rx="5" fill="#334155"/>
                    <rect x="28" y="34" width="44" height="38" rx="12" fill="#f97316"/>
                    <rect x="32" y="38" width="36" height="7" rx="3.5" fill="#ea580c"/>
                    <rect x="32" y="46" width="36" height="7" rx="3.5" fill="#c2410c"/>
                    <rect x="32" y="54" width="36" height="7" rx="3.5" fill="#9a3412"/>
                    <path d="M26 44 C24 35, 42 34, 48 37 C52 39, 52 46, 44 48 C36 50, 26 48, 26 44 Z" fill="#fb923c"/>
                  </svg>
                </div>

                <!-- 3. AI ra BAO -->
                <div id="ai-hand-paper" class="ai-hand-item">
                  <svg viewBox="0 0 100 100" class="hand-svg-large" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="38" y="72" width="24" height="18" rx="5" fill="#334155"/>
                    <path d="M34 46 C34 46, 30 62, 34 72 L66 72 C70 62, 66 46, 66 46 Z" fill="#f97316"/>
                    <rect x="20" y="44" width="18" height="10" rx="5" transform="rotate(-30 20 44)" fill="#fb923c"/>
                    <rect x="34" y="16" width="9" height="33" rx="4.5" fill="#fdba74"/>
                    <rect x="45" y="12" width="10" height="37" rx="5" fill="#fdba74"/>
                    <rect x="56" y="16" width="9" height="33" rx="4.5" fill="#fdba74"/>
                    <rect x="66" y="24" width="8" height="26" rx="4" fill="#fb923c"/>
                  </svg>
                </div>

                <!-- 4. AI ra KÉO -->
                <div id="ai-hand-scissors" class="ai-hand-item">
                  <svg viewBox="0 0 100 100" class="hand-svg-large" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="38" y="70" width="24" height="18" rx="5" fill="#334155"/>
                    <rect x="34" y="42" width="32" height="30" rx="8" fill="#f97316"/>
                    <rect x="46" y="46" width="18" height="8" rx="4" fill="#ea580c"/>
                    <rect x="46" y="55" width="18" height="8" rx="4" fill="#c2410c"/>
                    <path d="M30 48 C30 40, 48 42, 52 48 C52 54, 44 56, 36 56 Z" fill="#fb923c"/>
                    <rect x="34" y="14" width="10" height="35" rx="5" transform="rotate(-15 34 44)" fill="#fdba74"/>
                    <rect x="50" y="14" width="10" height="35" rx="5" transform="rotate(15 50 44)" fill="#fdba74"/>
                  </svg>
                </div>
              </div>
            </div>

            <!-- DÒNG KẾT QUẢ / TRẠNG THÁI KHUNG AI (NẰM DƯỚI Ô TAY AI) -->
            <div id="ai-result-box" class="ai-result-box">
              <div id="ai-result-title" class="ai-result-title color-muted">AI ĐANG SUY NGHĨ</div>
              <div id="ai-result-detail" class="ai-result-detail"></div>
            </div>
          </div>

        </div>

        <!-- 3. DƯỚI CÙNG: THANH ĐIỀU KHIỂN (CONTROLS) -->
        <footer class="game-controls">
          <button id="btn-game-play" class="btn-game-primary" aria-label="Bắt đầu ván chơi">
            CHƠI (SPACE)
          </button>
          
          <button id="btn-game-reset" class="btn-game-secondary" title="Đặt lại tỉ số về 0">
            ↺ Reset điểm (R)
          </button>
        </footer>

      </div>
    </section>

  </main>

  <!-- Thông báo Toast nhanh -->
  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

  <!-- Nạp scripts theo đúng thứ tự: demo_state.js, game_ui.js, app.js -->
  <script src="demo_state.js"></script>
  <script src="game_ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
